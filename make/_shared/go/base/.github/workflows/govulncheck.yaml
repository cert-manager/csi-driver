# Nightly security scan. Runs govulncheck against the Go code and, where the
# repository builds OCI images, oci-security-scan, which uses trivy to check
# the images for fixable vulnerabilities of severity MEDIUM, HIGH or CRITICAL.
# Scans the default branch, the two newest release branches and the latest
# release tag, to give early warning when a released image, or an image we are
# about to release, contains known vulnerabilities.
#
# This file keeps its historic "govulncheck" name so that GitHub continues to
# treat it as the same registered workflow (which allows workflow_dispatch on
# any branch) and to avoid leaving stale workflow files in downstream repos.
name: security-scan
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  list-refs:
    runs-on: ubuntu-latest

    if: github.repository == '{{REPLACE:GH-REPOSITORY}}'

    outputs:
      refs: ${{ steps.list-refs.outputs.refs }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      # Scan the branch this workflow runs on (usually the default branch),
      # the two newest release branches, and the latest tag which is not a
      # pre-release.
      - id: list-refs
        run: |
          refs="$(
            {
              echo "${{ github.ref_name }}"
              git branch --remotes --list 'origin/release-*' --format='%(refname:lstrip=3)' --sort=-version:refname \
                | grep -E '^release-[0-9]+\.[0-9]+$' | head -n 2
              git tag --list 'v*' --sort=-version:refname | grep -v '[-]' | head -n 1
            } | jq --raw-input . | jq --slurp --compact-output 'map(select(. != "")) | unique'
          )"
          echo "refs=${refs}" >> "$GITHUB_OUTPUT"

  security-scan:
    runs-on: ubuntu-latest

    needs: list-refs

    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.list-refs.outputs.refs) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          # Adding `fetch-depth: 0` makes sure tags are also fetched. We need
          # the tags so `git describe` returns a valid version.
          # see https://github.com/actions/checkout/issues/701 for extra info about this option
          fetch-depth: 0

      - id: go-version
        run: |
          make print-go-version >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.result }}

      - run: make verify-govulncheck

      # Only repositories which build OCI images have the oci-security-scan
      # target; older release branches and tags may not have it yet either.
      - run: |
          if make --dry-run oci-security-scan >/dev/null 2>&1; then
            make oci-security-scan
          else
            echo "::notice::The oci-security-scan target does not exist on ${{ matrix.ref }}; skipping."
          fi
