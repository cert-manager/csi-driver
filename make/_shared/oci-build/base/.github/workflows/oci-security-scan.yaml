# Scan the OCI images built from the default branch, the release branches and
# the latest release tag every night, using trivy, to alert us when a released
# image, or an image we are about to release, contains fixable vulnerabilities
# of severity MEDIUM, HIGH or CRITICAL.
name: oci-security-scan
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  list-refs:
    runs-on: ubuntu-latest

    if: github.repository == '{{REPLACE:GH-REPOSITORY}}'

    outputs:
      refs: ${{ steps.list-refs.outputs.refs }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      # Scan the branch this workflow runs on (the default branch), the two
      # newest release branches, and the latest tag which is not a pre-release.
      - id: list-refs
        run: |
          refs="$(
            {
              echo "${{ github.ref_name }}"
              git branch --remotes --list 'origin/release-*' --format='%(refname:lstrip=3)' --sort=-version:refname \
                | grep -E '^release-[0-9]+\.[0-9]+$' | head -n 2
              git tag --list 'v*' --sort=-version:refname | grep -v '[-]' | head -n 1
            } | jq --raw-input . | jq --slurp --compact-output 'map(select(. != "")) | unique'
          )"
          echo "refs=${refs}" >> "$GITHUB_OUTPUT"

  oci-security-scan:
    runs-on: ubuntu-latest

    needs: list-refs

    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.list-refs.outputs.refs) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          # Adding `fetch-depth: 0` makes sure tags are also fetched. We need
          # the tags so `git describe` returns a valid version.
          # see https://github.com/actions/checkout/issues/701 for extra info about this option
          fetch-depth: 0

      - id: go-version
        run: |
          make print-go-version >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.result }}

      # Older release branches and tags may not have the oci-security-scan
      # target yet; skip them rather than fail.
      - run: |
          if make --dry-run oci-security-scan >/dev/null 2>&1; then
            make oci-security-scan
          else
            echo "::warning::The oci-security-scan target does not exist on ${{ matrix.ref }}; skipping."
          fi
